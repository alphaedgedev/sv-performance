<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Block Comparison</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f9f9;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
    }

    .container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .card {
      flex: 1 1 300px;
      max-width: 500px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
    }

    .card h2 {
      background: #007acc;
      color: white;
      margin: 0;
      padding: 1rem;
      font-size: 1.25rem;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <h1>App Block Preview</h1>
  <div class="container">
    <div class="card">
      <h2>Before Adding The App Block</h2>
      <img src="before.png" alt="Before App Block" />
    </div>
    <div class="card">
      <h2>After Adding The App Block</h2>
      <img src="after.png" alt="After App Block" />
    </div>
  </div>

</body>
</html>
